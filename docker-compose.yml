version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: adaptivelearn_db
    restart: always
    environment:
      POSTGRES_USER: adaptiveuser
      POSTGRES_PASSWORD: adaptivepassword
      POSTGRES_DB: adaptivelearn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptiveuser -d adaptivelearn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptivelearn_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://adaptiveuser:adaptivepassword@db:5432/adaptivelearn
      - SECRET_KEY=development-secret-key-change-in-production-only
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adaptivelearn_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
